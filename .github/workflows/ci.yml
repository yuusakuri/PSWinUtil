name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-powershell:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"

      - name: Remove PSGallery registration to verify bootstrap recovery
        run: |
          Import-Module PowerShellGet -MaximumVersion '2.2.5' -ErrorAction Stop
          if (Get-PSRepository -Name 'PSGallery' -ErrorAction Ignore) {
              Unregister-PSRepository -Name 'PSGallery' -ErrorAction Stop
          }

      - name: Install development modules
        run: |
          $requiredPowerShellGetVersion = [version]'2.2.5'
          $newerPowerShellGetRoots = @(
              Get-Module -Name 'PowerShellGet' -ListAvailable |
                  Where-Object { $_.Version -ge $requiredPowerShellGetVersion } |
                  ForEach-Object { Split-Path -Path (Split-Path -Path $_.ModuleBase -Parent) -Parent } |
                  Select-Object -Unique
          )
          $env:PSModulePath = ($env:PSModulePath -split [IO.Path]::PathSeparator | Where-Object { $_ -notin $newerPowerShellGetRoots }) -join [IO.Path]::PathSeparator
          $olderPowerShellGet = Get-Module -Name 'PowerShellGet' -ListAvailable |
              Where-Object { $_.Version -lt $requiredPowerShellGetVersion }
          if (-not $olderPowerShellGet) {
              throw 'The CI image must provide an older inbox PowerShellGet for the bootstrap test.'
          }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\install.ps1

      - name: Verify repeated development module installation
        run: |
          $requirements = Import-PowerShellDataFile .\build.requirements.psd1
          Import-Module Microsoft.PowerShell.PSResourceGet -RequiredVersion $requirements['Microsoft.PowerShell.PSResourceGet'] -ErrorAction Stop
          Unregister-PSResourceRepository -Name 'PSGallery' -ErrorAction Stop
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\install.ps1 | Out-Null
          if ($LASTEXITCODE -ne 0) {
              throw "The repeated installation script failed with exit code $LASTEXITCODE."
          }
          $psGallery = Get-PSResourceRepository -Name 'PSGallery' -ErrorAction Stop
          if (-not $psGallery.Trusted) {
              throw 'PSGallery must be trusted after development module installation.'
          }
          foreach ($name in $requirements.Keys) {
              Import-Module -Name $name -RequiredVersion $requirements[$name] -ErrorAction Stop
          }

      - name: Run verification
        run: powershell.exe -ExecutionPolicy Bypass -File .\dev.ps1 verify
