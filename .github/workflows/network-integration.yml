name: Network integration contracts

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
  pull_request:
    paths:
      - 'src/PSWinUtil/Public/Get-WUFlutterSdkUrl.ps1'
      - 'src/PSWinUtil/Private/Get-WUFlutterSdkRelease.ps1'
      - 'src/PSWinUtil/Public/Invoke-WUHttpFileDownload.ps1'
      - 'tests/integration/*NetworkIntegration.Tests.ps1'
      - '.github/workflows/network-integration.yml'

permissions:
  contents: read

jobs:
  network:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
      - run: .\install.ps1
      - run: .\dev.ps1 test-network-integration
