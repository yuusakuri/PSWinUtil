name: Android SDK integration

on:
  pull_request:
    paths:
      - 'src/PSWinUtil/**'
      - 'tests/integration/AndroidSdkInstallation.Tests.ps1'
      - '.github/workflows/android-sdk.yml'
  workflow_dispatch:
  schedule:
    - cron: '11 3 * * 1'

permissions:
  contents: read

jobs:
  android-sdk:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Android CLI
        run: |
          $cliDirectory = Join-Path $env:RUNNER_TEMP 'android-cli'
          New-Item -Path $cliDirectory -ItemType Directory -Force | Out-Null
          Invoke-WebRequest -UseBasicParsing -Uri 'https://dl.google.com/android/cli/latest/windows_x86_64/android.exe' -OutFile (Join-Path $cliDirectory 'android.exe')
          $cliDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build the module
        run: |
          .\install.ps1
          .\dev.ps1 build
      - name: Verify selected SDK component versions
        run: |
          $env:PSWINUTIL_RUN_ANDROID_INTEGRATION = '1'
          $env:PSWINUTIL_ANDROID_TEST_SDK = $env:ANDROID_HOME
          Import-Module Pester -RequiredVersion 6.0.1
          $result = Invoke-Pester -Path .\tests\integration\AndroidSdkInstallation.Tests.ps1 -Tag AndroidSdk -Output Detailed -PassThru
          if ($result.FailedCount -gt 0 -or $result.FailedContainersCount -gt 0 -or $result.PassedCount -le 0) {
            throw 'Android SDK tests failed or no tests passed.'
          }
