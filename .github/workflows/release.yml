name: Release

on:
  pull_request:
    branches:
      - master
    types:
      - closed

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    environment: powershell-gallery
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    defaults:
      run:
        shell: powershell
    env:
      RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
      RELEASE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}

    steps:
      - name: Check the publishing credential
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PSGALLERY_API_KEY)) {
              throw 'The powershell-gallery environment does not define PSGALLERY_API_KEY.'
          }

      - name: Check out the merged release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Set up the .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"

      - name: Install development modules
        run: .\install.ps1

      - name: Validate release identity
        id: release
        run: |
          git fetch origin master --tags
          if ($LASTEXITCODE -ne 0) {
              throw 'Could not fetch master and release tags.'
          }

          $headCommit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $headCommit -ne $env:RELEASE_COMMIT) {
              throw "Checked out commit $headCommit does not match merged release commit $env:RELEASE_COMMIT."
          }

          git merge-base --is-ancestor $headCommit origin/master
          if ($LASTEXITCODE -ne 0) {
              throw "Release commit is not part of origin/master: $headCommit"
          }

          $identity = .\dev.ps1 release-identity $env:RELEASE_BRANCH

          "version=$($identity.Version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=$($identity.TagName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Run final verification
        run: powershell.exe -ExecutionPolicy Bypass -File .\dev.ps1 verify

      - name: Validate built module version
        run: |
          $manifest = Test-ModuleManifest -Path '.\output\PSWinUtil\PSWinUtil.psd1' -ErrorAction Stop
          if ([string]$manifest.Version -ne '${{ steps.release.outputs.version }}') {
              throw "Built ModuleVersion $($manifest.Version) does not match the release version."
          }

      - name: Inspect publication state
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $state = .\dev.ps1 release-state $env:RELEASE_COMMIT

          "tag_exists=$($state.TagExists.ToString().ToLowerInvariant())" |
              Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "gallery_exists=$($state.GalleryExists.ToString().ToLowerInvariant())" |
              Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "github_release_exists=$($state.GitHubReleaseExists.ToString().ToLowerInvariant())" |
              Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Create and push tag
        if: steps.publication.outputs.tag_exists != 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag --annotate '${{ steps.release.outputs.tag }}' `
              --message 'PSWinUtil ${{ steps.release.outputs.version }}' `
              $env:RELEASE_COMMIT
          git push origin 'refs/tags/${{ steps.release.outputs.tag }}'

      - name: Create release artifact
        id: artifact
        if: steps.publication.outputs.github_release_exists != 'true'
        run: |
          $artifactName = 'PSWinUtil-${{ steps.release.outputs.version }}.zip'
          $artifactPath = Join-Path -Path $PWD -ChildPath $artifactName
          Compress-Archive `
              -LiteralPath '.\output\PSWinUtil' `
              -DestinationPath $artifactPath `
              -CompressionLevel Optimal
          "path=$artifactPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Attest the release artifact
        if: steps.publication.outputs.github_release_exists != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.artifact.outputs.path }}

      - name: Publish to PowerShell Gallery
        if: steps.publication.outputs.gallery_exists != 'true'
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          Import-Module -Name 'Microsoft.PowerShell.PSResourceGet'
          Publish-PSResource `
              -Path '.\output\PSWinUtil' `
              -Repository 'PSGallery' `
              -ApiKey $env:PSGALLERY_API_KEY `
              -ErrorAction Stop

      - name: Confirm PowerShell Gallery publication
        run: |
          Import-Module -Name 'Microsoft.PowerShell.PSResourceGet'
          $version = '${{ steps.release.outputs.version }}'
          for ($attempt = 1; $attempt -le 12; $attempt++) {
              $galleryResource = Find-PSResource `
                  -Name 'PSWinUtil' `
                  -Version "[$version]" `
                  -Repository 'PSGallery' `
                  -ErrorAction SilentlyContinue
              if ($null -ne $galleryResource) {
                  return
              }
              Start-Sleep -Seconds 10
          }
          throw "PowerShell Gallery did not expose PSWinUtil $version within the expected time."

      - name: Publish GitHub Release
        if: steps.publication.outputs.github_release_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ steps.release.outputs.tag }}' `
              '${{ steps.artifact.outputs.path }}' `
              --repo $env:GITHUB_REPOSITORY `
              --verify-tag `
              --title '${{ steps.release.outputs.version }}' `
              --generate-notes
